<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>끼리-말 비공개 대화방 초대장</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px 12px;min-height:100vh;background:#FEF08A;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif;color:#1E293B;display:flex;justify-content:center;align-items:flex-start}
.card{width:100%;max-width:420px;background:#FEF08A;border:2px solid #1E293B;border-radius:12px;padding:22px;text-align:center}
h1{font-size:21px;font-weight:800;margin:0 0 7px}
.sub{font-size:13px;margin:0 0 18px}
.label{display:block;text-align:left;font-size:14px;font-weight:700;margin-bottom:7px}
input[type=text]{width:100%;min-height:58px;padding:12px;border:2px solid #1E293B;border-radius:6px;background:#fff;font:inherit;font-size:16px}
.hint{text-align:left;font-size:12px;line-height:1.5;margin:7px 0 12px}
.btn{min-height:42px;padding:9px 6px;border:2px solid #1E293B;border-radius:6px;background:#fff;color:#1E293B;font-weight:700;font-size:13px;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.primary{width:100%;border:0;background:#FFD700;font-size:15px;font-weight:800}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
h2{font-size:17px;font-weight:800;margin:24px 0 10px;text-align:left}
.list{display:flex;flex-direction:column;gap:8px;text-align:left}
.item{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:11px;background:#fff;border:1.5px solid #1E293B;border-radius:6px;overflow-wrap:anywhere}
.item input{width:17px;height:17px;margin:2px 0 0}
.txt{font-weight:700;white-space:pre-wrap;word-break:break-word}
.item-meta{font-size:11px;color:#475569;margin-top:6px}
.item-actions{margin-top:8px;display:flex;justify-content:flex-end}
.small-btn{min-height:32px;padding:5px 10px;border:1.5px solid #1E293B;border-radius:5px;background:#fff;color:#1E293B;font-weight:700;font-size:12px;cursor:pointer}
.empty{padding:18px 8px;border:1.5px dashed #64748B;border-radius:6px;font-size:13px;color:#475569;text-align:center}
.status{margin-top:10px;min-height:18px;font-size:13px;font-weight:700;text-align:left;overflow-wrap:anywhere}
.note{font-size:11px;line-height:1.5;color:#475569;margin:14px 0 0;text-align:left}
.nickname-panel{margin:0 0 18px;text-align:left}
.nickname-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="card">
<h1>끼리-말 비공개 대화방 초대장</h1>
<p class="sub">초대 문구를 직접 작성해 전송하세요.</p>

<section id="loginPanel" style="text-align:left;margin-bottom:18px">
  <label class="label" for="email">이메일</label>
  <input id="email" type="email" autocomplete="username" placeholder="Firebase 계정 이메일" style="width:100%;min-height:42px;padding:9px;border:2px solid #1E293B;border-radius:6px;font:inherit;margin-bottom:9px">
  <label class="label" for="password">비밀번호</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="비밀번호" style="width:100%;min-height:42px;padding:9px;border:2px solid #1E293B;border-radius:6px;font:inherit">
  <button class="btn" id="login" type="button" style="width:100%;margin-top:9px">로그인</button>
</section>

<div style="text-align:left;margin-bottom:18px">
  <button class="btn" id="logout" type="button" hidden>로그아웃</button>
  <div class="status" id="authStatus" role="status" aria-live="polite">대화 기록을 불러오려면 로그인하세요.</div>
</div>

<section id="nicknamePanel" class="nickname-panel" hidden>
  <label class="label" for="nickname">사용할 닉네임</label>
  <div class="nickname-row">
    <input id="nickname" type="text" maxlength="5" placeholder="한글 3~5글자" autocomplete="off" style="min-height:42px;padding:9px;border:2px solid #1E293B;border-radius:6px;font:inherit;min-width:0">
    <button class="btn" id="saveNickname" type="button">등록</button>
  </div>
  <p class="hint">한글 3~5글자만 사용할 수 있습니다. <br>숫자, 영어, 띄어쓰기, 특수문자는 사용할 수 없습니다.</br></p>
  <div class="status" id="nicknameStatus" role="status" aria-live="polite"></div>
</section>

<label class="label" for="msg">초대 문구</label>
<input id="msg" type="text" maxlength="100" placeholder="초대하고 싶은 말을 입력하세요" autocomplete="off">
<p class="hint">한글 5~30글자 · 띄어쓰기는 글자 수에서 제외됩니다.<br>
한글과 띄어쓰기만 입력할 수 있습니다. <b id="count">0 / 30</b></p>
<button class="btn primary" id="register" type="button">초대장 전송</button>
<div class="status" id="status" role="status" aria-live="polite"></div>

<h2>전송 이력</h2>
<div class="tools">
  <button class="btn" id="selectAll" type="button">전체 선택</button>
  <button class="btn" id="deleteAll" type="button">전체 삭제</button>
  <button class="btn" id="deleteSelected" type="button">선택 항목 삭제</button>
  <button class="btn" id="clear" type="button">선택 해제</button>
</div>
<div class="list" id="list"><div class="empty">아직 전송된 초대 문구가 없습니다.</div></div>
<p class="note">※ 로그인하면 같은 공유 기록을 사용하는 계정과 기기에서 전송 이력이 공유됩니다.<br>
※ 본인은 자기 글만 삭제할 수 있으며, 주인장은 모든 글을 삭제할 수 있습니다.</p>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script>
(() => {
'use strict';

const firebaseConfig = {
  apiKey: "AIzaSyD--yv8AalcVp53ioeS38TukEgSiSDaKhM",
  authDomain: "kkiri-mal.firebaseapp.com",
  databaseURL: "https://kkiri-mal-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kkiri-mal",
  storageBucket: "kkiri-mal.firebasestorage.app",
  messagingSenderId: "796572177173",
  appId: "1:796572177173:web:f3fc3638bb65439fba4f1c"
};

const OWNER_UID = 'dkREk51h4EgdpovjsGDXJbd5KE73';

const $ = id => document.getElementById(id);
const input = $('msg');
const count = $('count');
const status = $('status');
const list = $('list');
const email = $('email');
const password = $('password');
const loginPanel = $('loginPanel');
const authStatus = $('authStatus');
const loginButton = $('login');
const logoutButton = $('logout');
const registerButton = $('register');
const nicknamePanel = $('nicknamePanel');
const nicknameInput = $('nickname');
const nicknameStatus = $('nicknameStatus');
const saveNicknameButton = $('saveNickname');

let currentUser = null;
let currentNickname = '';
let legacyRef = null;
let postsRef = null;
let legacyListener = null;
let postsListener = null;
let legacyHistory = [];
let postsHistory = [];
let busy = false;
let authGeneration = 0;

if (!window.firebase) {
  authStatus.textContent = 'Firebase를 불러오지 못했습니다. 네트워크 연결을 확인해 주세요.';
  loginButton.disabled = true;
  return;
}

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const isOwner = () => !!currentUser && currentUser.uid === OWNER_UID;
const length = s => [...s.replace(/\s/g, '')].length;
const isKorean = s => /^[가-힣ㄱ-ㅎㅏ-ㅣ\s]*$/u.test(s);

function updateCount() {
  const n = length(input.value);
  count.textContent = n + ' / 30';
  count.style.color = n > 30 ? '#B91C1C' : '#334155';
}

function setBusy(value) {
  busy = value;
  registerButton.disabled = value;
  $('deleteAll').disabled = value;
  $('deleteSelected').disabled = value;
}

function stopSync() {
  if (legacyRef && legacyListener) legacyRef.off('value', legacyListener);
  if (postsRef && postsListener) postsRef.off('value', postsListener);

  legacyRef = null;
  postsRef = null;
  legacyListener = null;
  postsListener = null;
}

function canDelete(item) {
  if (!currentUser) return false;
  if (isOwner()) return true;

  // 작성자 정보가 없는 과거 기록은 일반 사용자가 삭제할 수 없습니다.
  return item.kind === 'post' && item.uid === currentUser.uid;
}

function getAllItems() {
  const legacy = legacyHistory.map(item => ({
    id: String(item.id),
    text: String(item.text || ''),
    uid: typeof item.uid === 'string' ? item.uid : '',
    authorName: typeof item.authorName === 'string' ? item.authorName : '',
    kind: 'legacy'
  }));

  const posts = postsHistory.map(item => ({
    id: String(item.id),
    text: String(item.text || ''),
    uid: typeof item.uid === 'string' ? item.uid : '',
    authorName: typeof item.authorName === 'string' ? item.authorName : '',
    kind: 'post'
  }));

  // 새 글을 먼저 표시합니다.
  return [...posts, ...legacy];
}

function render() {
  list.replaceChildren();

  const items = getAllItems();

  if (!items.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '아직 전송된 초대 문구가 없습니다.';
    list.append(empty);
    return;
  }

  items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'item';

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'pick';
    cb.dataset.kind = item.kind;
    cb.value = item.id;
    cb.setAttribute('aria-label', item.text + ' 선택');
    cb.disabled = !canDelete(item);

    const content = document.createElement('div');

    const text = document.createElement('div');
    text.className = 'txt';
    text.textContent = item.text;
    content.append(text);

    const meta = document.createElement('div');
    meta.className = 'item-meta';

    const author = item.authorName || '작성자 미확인';
    meta.textContent = author;

    content.append(meta);

    if (canDelete(item)) {
      const actions = document.createElement('div');
      actions.className = 'item-actions';

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'small-btn';
      del.textContent = '이 글 삭제';
      del.addEventListener('click', () => deleteOne(item));

      actions.append(del);
      content.append(actions);
    }

    row.append(cb, content);
    list.append(row);
  });
}

function showWriteError(error) {
  console.error('Firebase 쓰기 오류:', error);

  if (error && error.code === 'PERMISSION_DENIED') {
    status.textContent = '권한이 없습니다. Firebase 규칙과 로그인 계정을 확인해 주세요.';
  } else {
    status.textContent = '저장에 실패했습니다. 네트워크와 Firebase 규칙을 확인해 주세요.';
  }
}

async function runWrite(task) {
  if (busy) {
    status.textContent = '작업 처리 중입니다. 잠시 기다려 주세요.';
    return;
  }

  setBusy(true);
  try {
    await task();
  } catch (error) {
    showWriteError(error);
  } finally {
    setBusy(false);
  }
}
password.addEventListener('keydown', event => {
  if (event.key === 'Enter') {
    event.preventDefault();
    loginButton.click();
  }
});
loginButton.addEventListener('click', async () => {
  const mail = email.value.trim();
  const pass = password.value;

  if (!mail || !pass) {
    authStatus.textContent = '이메일과 비밀번호를 입력해 주세요.';
    return;
  }

  loginButton.disabled = true;
  authStatus.textContent = '로그인 중...';

  try {
    await auth.signInWithEmailAndPassword(mail, pass);
    password.value = '';
  } catch (error) {
    const messages = {
      'auth/invalid-email': '이메일 형식을 확인해 주세요.',
      'auth/invalid-credential': '이메일 또는 비밀번호가 올바르지 않습니다.',
      'auth/user-not-found': '계정을 찾을 수 없습니다.',
      'auth/wrong-password': '비밀번호가 올바르지 않습니다.',
      'auth/too-many-requests': '로그인 시도가 많습니다. 잠시 후 다시 시도해 주세요.',
      'auth/network-request-failed': '네트워크 연결을 확인해 주세요.'
    };

    authStatus.textContent =
      '로그인 실패: ' + (messages[error.code] || error.message || '알 수 없는 오류');
    console.error('로그인 오류:', error);
  } finally {
    loginButton.disabled = !!currentUser;
  }
});

logoutButton.addEventListener('click', async () => {
  logoutButton.disabled = true;

  try {
    await auth.signOut();
    authStatus.textContent = '로그아웃했습니다.';
  } catch (error) {
    authStatus.textContent = '로그아웃하지 못했습니다.';
    console.error(error);
  } finally {
    logoutButton.disabled = false;
  }
});

auth.onAuthStateChanged(async user => {
  authGeneration++;
  const generation = authGeneration;

  stopSync();
  currentUser = user || null;
  legacyHistory = [];
  postsHistory = [];
  render();

  if (!user) {
    loginPanel.hidden = false;
    nicknamePanel.hidden = true;
    currentNickname = '';
    nicknameInput.disabled = false;
    saveNicknameButton.hidden = false;
    saveNicknameButton.disabled = false;
    email.disabled = false;
    password.disabled = false;
    loginButton.hidden = false;
    loginButton.disabled = false;
    logoutButton.hidden = true;
    authStatus.textContent = '대화 기록을 불러오려면 로그인하세요.';
    status.textContent = '';
    return;
  }

  loginPanel.hidden = true;
  nicknamePanel.hidden = user.uid === OWNER_UID;
  logoutButton.hidden = false;

  // 주인장은 별도 닉네임 설정 없이 '대장'으로 표시합니다.
  if (user.uid === OWNER_UID) {
    currentNickname = '대장';
    nicknameInput.value = '';
    nicknameInput.disabled = true;
    saveNicknameButton.hidden = true;
    nicknameStatus.textContent = '';
    authStatus.textContent = '로그인됨 · 대장';
  }
  logoutButton.disabled = false;

  if (user.uid !== OWNER_UID) {
    // 일반 계정만 닉네임을 불러오거나 설정합니다.
    nicknameStatus.textContent = '닉네임을 한글 3~5글자로 설정해 주세요.';
    try {
      const nicknameSnapshot = await db.ref('profiles/' + user.uid + '/nickname').once('value');
      if (generation !== authGeneration || !currentUser || currentUser.uid !== user.uid) return;
      const savedNickname = nicknameSnapshot.val();
      if (typeof savedNickname === 'string' && /^[가-힣]{3,5}$/u.test(savedNickname)) {
        currentNickname = savedNickname;
        nicknameInput.value = savedNickname;
        nicknameInput.disabled = true;
        saveNicknameButton.hidden = true;
        nicknamePanel.hidden = true;
        nicknameStatus.textContent = '';
        authStatus.textContent = '로그인됨 · ' + savedNickname;
      } else {
        currentNickname = '';
        nicknameInput.value = '';
        nicknameInput.disabled = false;
        saveNicknameButton.hidden = false;
        authStatus.textContent = '로그인됨 · 닉네임 등록 필요';
      }
    } catch (error) {
      nicknameStatus.textContent = '닉네임을 불러오지 못했습니다. Firebase 규칙을 확인해 주세요.';
      console.error('닉네임 읽기 오류:', error);
    }
  }

  legacyRef = db.ref('shared/history');
  postsRef = db.ref('shared/posts');

  const currentLegacyRef = legacyRef;
  const currentPostsRef = postsRef;

  legacyListener = snapshot => {
    if (generation !== authGeneration || !currentUser ||
        currentUser.uid !== user.uid || legacyRef !== currentLegacyRef) return;

    const value = snapshot.val();

    if (value === null) {
      legacyHistory = [];
    } else if (Array.isArray(value)) {
      legacyHistory = value.filter(x =>
        x && typeof x.id === 'string' && typeof x.text === 'string'
      );
    } else {
      authStatus.textContent = '기존 기록 형식이 올바르지 않습니다.';
      return;
    }

    render();
  };

  postsListener = snapshot => {
    if (generation !== authGeneration || !currentUser ||
        currentUser.uid !== user.uid || postsRef !== currentPostsRef) return;

    const value = snapshot.val() || {};

    postsHistory = Object.entries(value)
      .filter(([id, item]) =>
        item && typeof item.text === 'string' &&
        typeof item.uid === 'string'
      )
      .map(([id, item]) => ({
        id,
        text: item.text,
        uid: item.uid,
        authorName: typeof item.authorName === 'string' ? item.authorName : ''
      }));

    render();
  };

  currentLegacyRef.on('value', legacyListener, error => {
    if (generation !== authGeneration) return;
    authStatus.textContent = '기존 기록을 불러오지 못했습니다. Firebase 규칙을 확인해 주세요.';
    console.error('기존 기록 읽기 오류:', error);
  });

  currentPostsRef.on('value', postsListener, error => {
    if (generation !== authGeneration) return;
    authStatus.textContent = '새 기록을 불러오지 못했습니다. Firebase 규칙을 확인해 주세요.';
    console.error('새 기록 읽기 오류:', error);
  });
}, error => {
  authStatus.textContent = '로그인 상태를 확인하지 못했습니다. 새로고침해 주세요.';
  console.error(error);
});

async function register() {
  const text = input.value.trim();
  const n = length(text);

  if (!currentUser) {
    status.textContent = '먼저 로그인해 주세요.';
    return;
  }
  if (!currentNickname) {
    status.textContent = '먼저 한글 3~5글자 닉네임을 저장해 주세요.';
    nicknameInput.focus();
    return;
  }
  if (!text) {
    status.textContent = '초대 문구를 입력해 주세요.';
    input.focus();
    return;
  }
  if (!isKorean(text)) {
    status.textContent = '한글과 띄어쓰기만 입력할 수 있습니다.';
    input.focus();
    return;
  }
  if (n < 5 || n > 30) {
    status.textContent = '띄어쓰기를 제외하고 5~30글자로 입력해 주세요.';
    input.focus();
    return;
  }

  await runWrite(async () => {
    const user = currentUser;
    if (!user) {
      status.textContent = '로그인 상태를 확인해 주세요.';
      return;
    }

    const id = window.crypto && window.crypto.randomUUID
      ? window.crypto.randomUUID()
      : Date.now() + '-' + Math.random().toString(36).slice(2);

    const item = {
      id,
      text,
      uid: user.uid,
      authorName: currentNickname
    };

    await db.ref('shared/posts/' + id).set(item);

    input.value = '';
    updateCount();
    status.textContent = '초대 문구가 전송되었습니다.';
    input.focus();
  });
}

async function deleteOne(item) {
  if (!currentUser || !canDelete(item)) {
    status.textContent = '이 글을 삭제할 권한이 없습니다.';
    return;
  }

  if (!confirm('이 초대 문구를 삭제할까요?')) return;

  await runWrite(async () => {
    if (item.kind === 'legacy') {
      if (!isOwner()) {
        status.textContent = '기존 기록은 주인장만 삭제할 수 있습니다.';
        return;
      }

      const ref = db.ref('shared/history');
      const result = await ref.transaction(current => {
        if (!Array.isArray(current)) return current;
        return current.filter(x => !x || String(x.id) !== item.id);
      });

      if (!result.committed) {
        status.textContent = '기존 기록을 삭제하지 못했습니다.';
        return;
      }
    } else {
      await db.ref('shared/posts/' + item.id).remove();
    }

    status.textContent = '초대 문구를 삭제했습니다.';
  });
}

async function saveNickname() {
  if (!currentUser) {
    nicknameStatus.textContent = '먼저 로그인해 주세요.';
    return;
  }
  if (currentUser.uid === OWNER_UID) {
    currentNickname = '대장';
    nicknameStatus.textContent = '주인장은 닉네임 설정이 필요하지 않습니다.';
    return;
  }
  const nickname = nicknameInput.value;
  if (!/^[가-힣]{3,5}$/u.test(nickname)) {
    nicknameStatus.textContent = '닉네임은 띄어쓰기 없이 한글 3~5글자로 입력해 주세요.';
    nicknameInput.focus();
    return;
  }
  saveNicknameButton.disabled = true;
  nicknameStatus.textContent = '닉네임 등록 중...';
  try {
    const user = currentUser;
    const nicknameRef = db.ref('profiles/' + user.uid + '/nickname');
    const existing = await nicknameRef.once('value');
    if (existing.exists()) {
      nicknameStatus.textContent = '이미 등록된 닉네임은 변경할 수 없습니다.';
      nicknameInput.value = String(existing.val());
      nicknameInput.disabled = true;
      saveNicknameButton.hidden = true;
      return;
    }
    await nicknameRef.set(nickname);
    if (!currentUser || currentUser.uid !== user.uid) return;
    currentNickname = nickname;
    authStatus.textContent = '로그인됨 · ' + nickname;
    nicknameInput.disabled = true;
    saveNicknameButton.hidden = true;
    nicknamePanel.hidden = true;
  } catch (error) {
    nicknameStatus.textContent = '닉네임 저장에 실패했습니다. Firebase 규칙을 확인해 주세요.';
    console.error('닉네임 저장 오류:', error);
  } finally {
    if (!currentNickname) saveNicknameButton.disabled = false;
  }
}

saveNicknameButton.addEventListener('click', saveNickname);
nicknameInput.addEventListener('keydown', event => {
  if (event.key === 'Enter') saveNickname();
});

registerButton.addEventListener('click', register);

input.addEventListener('keydown', event => {
  if (event.key === 'Enter') register();
});

input.addEventListener('input', updateCount);

$('selectAll').addEventListener('click', () => {
  list.querySelectorAll('.pick:not(:disabled)').forEach(cb => {
    cb.checked = true;
  });
  status.textContent = '삭제할 수 있는 항목을 선택했습니다.';
});

$('clear').addEventListener('click', () => {
  list.querySelectorAll('.pick').forEach(cb => {
    cb.checked = false;
  });
  status.textContent = '선택을 해제했습니다.';
});

$('deleteSelected').addEventListener('click', async () => {
  const selected = [...list.querySelectorAll('.pick:checked')]
    .map(cb => ({
      id: cb.value,
      kind: cb.dataset.kind
    }));

  if (!selected.length) {
    status.textContent = '삭제할 항목을 먼저 선택해 주세요.';
    return;
  }

  if (!confirm('선택한 ' + selected.length + '개 항목을 삭제할까요?')) return;

  await runWrite(async () => {
    let deleted = 0;
    let failed = 0;

    for (const item of selected) {
      try {
        if (item.kind === 'legacy') {
          if (!isOwner()) {
            failed++;
            continue;
          }

          const ref = db.ref('shared/history');
          const result = await ref.transaction(current => {
            if (!Array.isArray(current)) return current;
            return current.filter(x => !x || String(x.id) !== item.id);
          });

          if (result.committed) deleted++;
          else failed++;
        } else {
          const target = postsHistory.find(x => x.id === item.id);
          if (!target || !canDelete({...target, kind:'post'})) {
            failed++;
            continue;
          }

          await db.ref('shared/posts/' + item.id).remove();
          deleted++;
        }
      } catch (error) {
        console.error('선택 항목 삭제 오류:', error);
        failed++;
      }
    }

    if (failed) {
      status.textContent = deleted + '개 삭제 완료, ' + failed +
        '개는 권한 또는 네트워크 문제로 삭제하지 못했습니다.';
    } else {
      status.textContent = deleted + '개 항목을 삭제했습니다.';
    }
  });
});

$('deleteAll').addEventListener('click', async () => {
  if (!currentUser) {
    status.textContent = '먼저 로그인해 주세요.';
    return;
  }

  const deletablePosts = postsHistory.filter(item =>
    isOwner() || item.uid === currentUser.uid
  );

  const deletableLegacy = isOwner() ? legacyHistory : [];

  const total = deletablePosts.length + deletableLegacy.length;

  if (!total) {
    status.textContent = isOwner()
      ? '삭제할 이력이 없습니다.'
      : '삭제할 본인 글이 없습니다.';
    return;
  }

  const message = isOwner()
    ? '전송 이력 ' + total + '개를 모두 삭제할까요? 이 작업은 되돌릴 수 없습니다.'
    : '본인이 작성한 글 ' + total + '개를 삭제할까요? 다른 사람의 글은 유지됩니다.';

  if (!confirm(message)) return;

  await runWrite(async () => {
    let deleted = 0;
    let failed = 0;

    for (const item of deletablePosts) {
      try {
        await db.ref('shared/posts/' + item.id).remove();
        deleted++;
      } catch (error) {
        console.error('글 삭제 오류:', error);
        failed++;
      }
    }

    if (isOwner() && deletableLegacy.length) {
      try {
        const ref = db.ref('shared/history');
        const result = await ref.set([]);
        void result;
        deleted += deletableLegacy.length;
      } catch (error) {
        console.error('기존 기록 삭제 오류:', error);
        failed += deletableLegacy.length;
      }
    }

    if (failed) {
      status.textContent = deleted + '개 삭제 완료, ' + failed +
        '개는 삭제하지 못했습니다.';
    } else {
      status.textContent = deleted + '개 항목을 삭제했습니다.';
    }
  });
});

updateCount();
render();
})();
</script>
</body>
</html>
