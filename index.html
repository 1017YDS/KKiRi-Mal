<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>끼리-말 비공개 대화방 초대장</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px 12px;min-height:100vh;background:#FEF08A;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif;color:#1E293B;display:flex;justify-content:center;align-items:flex-start}
.card{width:100%;max-width:420px;background:#FEF08A;border:2px solid #1E293B;border-radius:12px;padding:22px;text-align:center}
h1{font-size:21px;font-weight:800;margin:0 0 7px}
.sub{font-size:13px;margin:0 0 18px}
.label{display:block;text-align:left;font-size:14px;font-weight:700;margin-bottom:7px}
input[type=text]{width:100%;min-height:58px;padding:12px;border:2px solid #1E293B;border-radius:6px;background:#fff;font:inherit;font-size:16px}
.hint{text-align:left;font-size:12px;line-height:1.5;margin:7px 0 12px}
.btn{min-height:42px;padding:9px 6px;border:2px solid #1E293B;border-radius:6px;background:#fff;color:#1E293B;font-weight:700;font-size:13px;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.primary{width:100%;border:0;background:#FFD700;font-size:15px;font-weight:800}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
h2{font-size:17px;font-weight:800;margin:24px 0 10px;text-align:left}
.list{display:flex;flex-direction:column;gap:8px;text-align:left}
.item{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:11px;background:#fff;border:1.5px solid #1E293B;border-radius:6px;overflow-wrap:anywhere}
.item input{width:17px;height:17px;margin:2px 0 0}
.txt{font-weight:700;white-space:pre-wrap;word-break:break-word}
.empty{padding:18px 8px;border:1.5px dashed #64748B;border-radius:6px;font-size:13px;color:#475569;text-align:center}
.status{margin-top:10px;min-height:18px;font-size:13px;font-weight:700;text-align:left;overflow-wrap:anywhere}
.note{font-size:11px;line-height:1.5;color:#475569;margin:14px 0 0;text-align:left}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="card">
<h1>끼리-말 비공개 대화방 초대장</h1>
<p class="sub">초대 문구를 직접 작성해 등록하세요.</p>

<section id="loginPanel" style="text-align:left;margin-bottom:18px">
  <label class="label" for="email">이메일</label>
  <input id="email" type="email" autocomplete="username" placeholder="Firebase 계정 이메일" style="width:100%;min-height:42px;padding:9px;border:2px solid #1E293B;border-radius:6px;font:inherit;margin-bottom:9px">
  <label class="label" for="password">비밀번호</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="비밀번호" style="width:100%;min-height:42px;padding:9px;border:2px solid #1E293B;border-radius:6px;font:inherit">
  <button class="btn" id="login" type="button" style="width:100%;margin-top:9px">로그인</button>
</section>

<div style="text-align:left;margin-bottom:18px">
  <button class="btn" id="logout" type="button" hidden>로그아웃</button>
  <div class="status" id="authStatus" role="status" aria-live="polite">대화 기록을 불러오려면 로그인하세요.</div>
</div>

<label class="label" for="msg">초대 문구</label>
<input id="msg" type="text" maxlength="100" placeholder="초대하고 싶은 말을 입력하세요" autocomplete="off">
<p class="hint">한글 5~30글자 · 띄어쓰기는 글자 수에서 제외됩니다.<br>
한글과 띄어쓰기만 입력할 수 있습니다. <b id="count">0 / 30</b></p>
<button class="btn primary" id="register" type="button">초대 문구 등록</button>
<div class="status" id="status" role="status" aria-live="polite"></div>

<h2>등록 이력</h2>
<div class="tools">
  <button class="btn" id="selectAll" type="button">전체 선택</button>
  <button class="btn" id="deleteAll" type="button">전체 삭제</button>
  <button class="btn" id="deleteSelected" type="button">선택 항목 삭제</button>
  <button class="btn" id="clear" type="button">선택 해제</button>
</div>
<div class="list" id="list"><div class="empty">아직 등록된 초대 문구가 없습니다.</div></div>
<p class="note">※ 로그인하면 같은 공유 기록을 사용하는 계정과 기기에서 등록 이력이 공유됩니다.</p>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script>
(() => {
'use strict';

const firebaseConfig = {
  apiKey: "AIzaSyD--yv8AalcVp53ioeS38TukEgSiSDaKhM",
  authDomain: "kkiri-mal.firebaseapp.com",
  databaseURL: "https://kkiri-mal-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kkiri-mal",
  storageBucket: "kkiri-mal.firebasestorage.app",
  messagingSenderId: "796572177173",
  appId: "1:796572177173:web:f3fc3638bb65439fba4f1c"
};

const $ = id => document.getElementById(id);
const input = $('msg');
const count = $('count');
const status = $('status');
const list = $('list');
const email = $('email');
const password = $('password');
const loginPanel = $('loginPanel');
const authStatus = $('authStatus');
const loginButton = $('login');
const logoutButton = $('logout');
const registerButton = $('register');
const storageKey = 'kkiri-mal-invite-history-v1';

let history = [];
let currentUser = null;
let historyRef = null;
let historyListener = null;
let busy = false;

if (!window.firebase) {
  authStatus.textContent = 'Firebase를 불러오지 못했습니다. 네트워크 연결을 확인해 주세요.';
  loginButton.disabled = true;
  return;
}

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();
const length = s => [...s.replace(/\s/g, '')].length;
const isKorean = s => /^[가-힣ㄱ-ㅎㅏ-ㅣ\s]*$/u.test(s);

function updateCount() {
  const n = length(input.value);
  count.textContent = n + ' / 30';
  count.style.color = n > 30 ? '#B91C1C' : '#334155';
}

function render() {
  list.replaceChildren();

  if (!history.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '아직 등록된 초대 문구가 없습니다.';
    list.append(empty);
    return;
  }

  history.forEach(item => {
    const row = document.createElement('div');
    row.className = 'item';

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'pick';
    cb.value = item.id;
    cb.setAttribute('aria-label', item.text + ' 선택');

    const content = document.createElement('div');
    const text = document.createElement('div');
    text.className = 'txt';
    text.textContent = item.text;

    // 날짜와 시간은 화면에 표시하지 않습니다.
    content.append(text);
    row.append(cb, content);
    list.append(row);
  });
}

function setBusy(value) {
  busy = value;
  registerButton.disabled = value;
  $('deleteAll').disabled = value;
  $('deleteSelected').disabled = value;
}

function stopSync() {
  if (historyRef && historyListener) {
    historyRef.off('value', historyListener);
  }
  historyRef = null;
  historyListener = null;
}

function validHistory(value) {
  return Array.isArray(value)
    ? value.filter(x => x &&
        typeof x.id === 'string' &&
        typeof x.text === 'string')
    : [];
}

function readLocalHistory() {
  try {
    const value = JSON.parse(localStorage.getItem(storageKey) || '[]');
    return validHistory(value);
  } catch (error) {
    console.warn('기존 기록 읽기 실패:', error);
    return [];
  }
}

async function changeHistory(transform) {
  if (!currentUser || !historyRef) {
    status.textContent = '먼저 로그인해 주세요.';
    return false;
  }

  try {
    const result = await historyRef.transaction(current => {
      return transform(validHistory(current));
    });

    if (!result.committed) {
      status.textContent = '기록을 저장하지 못했습니다. 다시 시도해 주세요.';
      return false;
    }

    history = validHistory(result.snapshot.val());
    render();
    return true;
  } catch (error) {
    console.error('기록 저장 오류:', error);
    status.textContent = '저장 실패: Firebase 권한 또는 네트워크를 확인해 주세요.';
    return false;
  }
}

async function runWrite(task) {
  if (busy) {
    status.textContent = '작업 처리 중입니다. 잠시 기다려 주세요.';
    return;
  }

  setBusy(true);
  try {
    await task();
  } finally {
    setBusy(false);
  }
}

loginButton.addEventListener('click', async () => {
  const mail = email.value.trim();
  const pass = password.value;

  if (!mail || !pass) {
    authStatus.textContent = '이메일과 비밀번호를 입력해 주세요.';
    return;
  }

  loginButton.disabled = true;
  authStatus.textContent = '로그인 중...';

  try {
    await auth.signInWithEmailAndPassword(mail, pass);
    password.value = '';
  } catch (error) {
    const messages = {
      'auth/invalid-email': '이메일 형식을 확인해 주세요.',
      'auth/invalid-credential': '이메일 또는 비밀번호가 올바르지 않습니다.',
      'auth/user-not-found': '계정을 찾을 수 없습니다.',
      'auth/wrong-password': '비밀번호가 올바르지 않습니다.',
      'auth/too-many-requests': '로그인 시도가 많습니다. 잠시 후 다시 시도해 주세요.',
      'auth/network-request-failed': '네트워크 연결을 확인해 주세요.'
    };

    authStatus.textContent =
      '로그인 실패: ' + (messages[error.code] || error.message || '알 수 없는 오류');
    console.error('로그인 오류:', error);
  } finally {
    loginButton.disabled = !!currentUser;
  }
});

logoutButton.addEventListener('click', async () => {
  logoutButton.disabled = true;

  try {
    await auth.signOut();
    authStatus.textContent = '로그아웃했습니다.';
  } catch (error) {
    authStatus.textContent = '로그아웃하지 못했습니다.';
    console.error(error);
  } finally {
    logoutButton.disabled = false;
  }
});

auth.onAuthStateChanged(user => {
  stopSync();
  currentUser = user || null;
  history = [];
  render();

  if (!user) {
    loginPanel.hidden = false;
    email.disabled = false;
    password.disabled = false;
    loginButton.hidden = false;
    loginButton.disabled = false;
    logoutButton.hidden = true;
    authStatus.textContent = '대화 기록을 불러오려면 로그인하세요.';
    status.textContent = '';
    return;
  }

  // 로그인 입력 영역만 숨기고 로그아웃 버튼은 별도로 표시합니다.
  loginPanel.hidden = true;
  logoutButton.hidden = false;
  logoutButton.disabled = false;
  authStatus.textContent = '로그인됨: ' + (user.email || '계정');

  // 두 계정이 함께 사용하는 공유 경로입니다.
  historyRef = db.ref('shared/history');

  const refForUser = historyRef;
  historyListener = snapshot => {
    if (!currentUser || currentUser.uid !== user.uid ||
        historyRef !== refForUser) return;

    const remote = snapshot.val();

    if (remote === null) {
      const local = readLocalHistory();

      if (local.length) {
        refForUser.transaction(current => current === null ? local : current)
          .then(result => {
            if (!currentUser || currentUser.uid !== user.uid) return;
            if (result.committed) {
              localStorage.removeItem(storageKey);
              authStatus.textContent = '기존 브라우저 기록을 클라우드로 이전했습니다.';
            }
          })
          .catch(error => {
            authStatus.textContent = '기록 이전 실패: Firebase 설정을 확인해 주세요.';
            console.error(error);
          });
      } else {
        history = [];
        render();
      }
      return;
    }

    if (!Array.isArray(remote)) {
      authStatus.textContent = '공유 기록 형식이 올바르지 않습니다.';
      return;
    }

    history = validHistory(remote);
    render();
  };

  historyRef.on('value', historyListener, error => {
    if (!currentUser || currentUser.uid !== user.uid) return;
    authStatus.textContent = '기록을 불러오지 못했습니다. Firebase 보안 규칙을 확인해 주세요.';
    console.error('기록 읽기 오류:', error);
  });
}, error => {
  authStatus.textContent = '로그인 상태를 확인하지 못했습니다. 새로고침해 주세요.';
  console.error(error);
});

async function register() {
  const text = input.value.trim();
  const n = length(text);

  if (!currentUser) {
    status.textContent = '먼저 로그인해 주세요.';
    return;
  }
  if (!text) {
    status.textContent = '초대 문구를 입력해 주세요.';
    input.focus();
    return;
  }
  if (!isKorean(text)) {
    status.textContent = '한글과 띄어쓰기만 입력할 수 있습니다.';
    input.focus();
    return;
  }
  if (n < 5 || n > 30) {
    status.textContent = '띄어쓰기를 제외하고 5~30글자로 입력해 주세요.';
    input.focus();
    return;
  }

  await runWrite(async () => {
    const item = {
      id: (window.crypto && window.crypto.randomUUID
        ? window.crypto.randomUUID()
        : Date.now() + '-' + Math.random().toString(36).slice(2)),
      text,
      date: new Date().toLocaleString('ko-KR', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      })
    };

    const ok = await changeHistory(items => [item, ...items]);
    if (ok) {
      input.value = '';
      updateCount();
      status.textContent = '초대 문구가 등록되었습니다.';
      input.focus();
    }
  });
}

registerButton.addEventListener('click', register);
input.addEventListener('keydown', event => {
  if (event.key === 'Enter') register();
});
input.addEventListener('input', updateCount);

$('selectAll').addEventListener('click', () => {
  list.querySelectorAll('.pick').forEach(cb => { cb.checked = true; });
  status.textContent = '전체 항목을 선택했습니다.';
});

$('clear').addEventListener('click', () => {
  list.querySelectorAll('.pick').forEach(cb => { cb.checked = false; });
  status.textContent = '선택을 해제했습니다.';
});

$('deleteSelected').addEventListener('click', async () => {
  const ids = new Set(
    [...list.querySelectorAll('.pick:checked')].map(cb => cb.value)
  );

  if (!ids.size) {
    status.textContent = '삭제할 항목을 먼저 선택해 주세요.';
    return;
  }

  if (!confirm('선택한 ' + ids.size + '개 항목을 삭제할까요?')) return;

  await runWrite(async () => {
    const ok = await changeHistory(items =>
      items.filter(item => !ids.has(item.id))
    );
    if (ok) status.textContent = ids.size + '개 항목을 삭제했습니다.';
  });
});

$('deleteAll').addEventListener('click', async () => {
  if (!history.length) {
    status.textContent = '삭제할 이력이 없습니다.';
    return;
  }

  if (!confirm('등록 이력 ' + history.length +
      '개를 모두 삭제할까요? 이 작업은 되돌릴 수 없습니다.')) return;

  await runWrite(async () => {
    const ok = await changeHistory(() => []);
    if (ok) status.textContent = '등록 이력을 모두 삭제했습니다.';
  });
});

updateCount();
render();
})();
</script>
</body>
</html>
