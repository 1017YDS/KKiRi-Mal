<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>끼리끼리 초대 코드 생성기</title>
    <style>
        /* 4대 제국 공통 순정 타이포그래피 및 가독성 폰트 시스템 */
        body {
            margin: 0;
            padding: 0;
            background-color: #FEF08A; /* 선명한 병아리 노랑색 고유 테마 */
              font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 1:1 대칭형 콤팩트 제어 카드 */
        .generator-card {
            width: 300px; /* 17자리 혼합 배열의 가시성을 위한 황금 해상도 폭 */
            background-color: #FEF08A;
            border: 2px solid #1E293B; /* 밤하늘 블랙 고유 테두리 락 */
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0px 0px 0px 0px #1E293B; /* 레트로 솔리드 그림자 */
            text-align: center;
        }

        .generator-title {
            font-size: 20px;
            font-weight: 800;
            color: #1E293B;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        /* 유저님 지정: 코드가 적혀있는 공간 (흰색 바탕 + 검정 글씨 1칸 고정) */
        .code-display-box {
            width: 100%;
            height: 58px;
            background-color: #FFFFFF; /* 무수정 순백색 */
            border: 2px solid #1E293B;
            border-radius: 6px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 19px; /* 숫자 혼합본의 서체 균형 핏 조율 */
            font-weight: 700;
            color: #000000; /* 선명한 절대 검정 */
            letter-spacing: 1px;
            margin-bottom: 16px;
            user-select: all; /* 클릭 시 전체 선택 편의 UX */
            overflow: hidden;
            white-space: nowrap;
        }

        /* 주권형 원터치 제어 단추 */
        .generate-btn {
            width: 100%;
            height: 46px;
            background-color: #ffd700;
            color: #FFFFFD;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.1s ease;
        }

        .generate-btn:hover {
            background-color: #ffd700;
        }

        .generate-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="generator-card">
        <div class="generator-title">끼리끼리 초대 코드</div>
        
        <!-- 유저님 지정 사양: 흰색 바탕 ➕ 검정 글씨 고정 1칸 배치 -->
        <div class="code-display-box" id="codeBox">초대 코드 칸</div>
        
        <button class="generate-btn" onclick="createInvitationCode()">초대 코드 발급 🛠️</button>
    </div>

    <script>
        function createInvitationCode() {
            // 영문 대소문자 및 숫자 후보
            const baseChars = "ABCÇDÐEFGHIÏƗJKLMNÑOPQRЯSTUƱVWXYƔZƵabcçdðefghiïɨjklmnñopqrɹstuʊvwxyɣzƶ";
            const digits = "0123456789";
            let chars = [];

            // 숫자 정확히 5자 생성
            for (let i = 0; i < 5; i++) {
                chars.push(digits[Math.floor(Math.random() * digits.length)]);
            }

            // 영어 글자 정확히 12자 생성
            for (let i = 0; i < 12; i++) {
                chars.push(baseChars[Math.floor(Math.random() * baseChars.length)]);
            }

            // 17자리의 위치를 무작위로 섞기
            for (let i = chars.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [chars[i], chars[j]] = [chars[j], chars[i]];
            }

            const rawCode = chars.join("");

            // ⚙️ 유저님 고유의 4대 변종 매크로 폭사 치환 알고리즘 작동
            let secureCode = "";
            for (let i = 0; i < rawCode.length; i++) {
                let char = rawCode[i];
                
                if (char === 'I') secureCode += 'Î';       // 대문자 아이 ➡️ 삿갓 Î 
                else if (char === 'l') secureCode += 'Ī';  // 소문자 엘 ➡️ 장음 Ī
                else if (char === 'O') secureCode += 'Ø';  // 대문자 오 ➡️ 빗금 Ø
                else if (char === 'o') secureCode += 'ø';  // 소문자 오 ➡️ 빗금 ø
                else secureCode += char;                   // 숫자 및 일반 문자는 정속 통과
            }
            
            // 최종 17자리 혼합 코드를 1칸 박스에 투사
            document.getElementById("codeBox").innerText = secureCode;
        }
    </script>
</body>
</html>
